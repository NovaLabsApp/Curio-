      const a = el('button', 'sm', 'Cartes'); a.type = 'button';
      a.addEventListener('click', function () { applyCountryFeed(name, [c[0]], c[1].replace(/^\S+\s/, '')); });
      const b = el('button', 'sm ghost', 'Cours'); b.type = 'button';
      b.addEventListener('click', function () { searchFor(c[2].split(' ')[0] + ' ' + name); });
      const qz = el('button', 'sm ghost', 'Quiz'); qz.type = 'button';
      qz.addEventListener('click', function () { startTopicQuiz({ country: name, catId: c[0] }); });
      bx.append(a, b, qz);
      row.appendChild(bx);
      body.appendChild(row);
    });
  }

  function showLineDetail(x) {
    const old = document.getElementById('lineSheet');
    if (old) old.remove();
    const sh = el('div', 'linesheet'); sh.id = 'lineSheet';
    const top = el('div', 'lsh');
    top.appendChild(el('b', null, yearLabel(x.y)));
    const close = el('button', 'sm ghost', 'Fermer'); close.type = 'button';
    close.addEventListener('click', function () { sh.remove(); });
    top.appendChild(close);
    sh.appendChild(top);
    sh.appendChild(el('div', 'era', eraOf(x.y)));
    const th = safeThumb(x.thumb);
    if (th) { const im = el('div', 'tth'); im.style.backgroundImage = 'url("' + th + '")'; sh.appendChild(im); }
    sh.appendChild(el('p', 'tt', (x.kind === 'person' ? '👤 ' : '📅 ') + x.title));
    if (x.text) sh.appendChild(el('p', 'sub', x.text));
    if (x.tag) sh.appendChild(el('span', 'tls', '🏷️ ' + x.tag));
    const act = el('div', 'prow');
    const ed = el('button', 'sm', 'Changer l\'année'); ed.type = 'button';
    ed.addEventListener('click', function () {
      const a = prompt('Nouvelle année pour « ' + x.title + ' » ? (ex. 1789, ou -44 pour 44 av. J.-C.)', String(x.y));
      if (a == null) return;
      const y = parseInt(String(a).trim(), 10);
      if (!isFinite(y) || y < -100000 || y > 2200 || y === 0) { toast('Année non valide'); return; }
      x.y = y; saveStudy(); sh.remove(); renderStudy();
    });
    const rm = el('button', 'sm ghost', 'Retirer de la frise'); rm.type = 'button';
    rm.addEventListener('click', function () { study.line = study.line.filter(function (z) { return z.id !== x.id; }); saveStudy(); sh.remove(); renderStudy(); });
    act.append(ed, rm);
    sh.appendChild(act);
    document.body.appendChild(sh);
  }

  function buildFrise(items, ei) {
    // zone affichée : toute la frise, ou une seule époque
    const whole = ei < 0;
    const r = whole ? { from: SUBS[0][1], to: SUBS[SUBS.length - 1][2] } : eraRange(ei);
    const subs = SUBS.filter(function (x) { return whole || x[4] === ei; });
    const x0 = xOfYear(r.from);
    const W = Math.round(xOfYear(r.to) - x0);
    const wrap = el('div', 'hscroll');
    const line = el('div', 'hline');
    // bandes des grandes époques
    ERAS.forEach(function (e, i) {
      if (!whole && i !== ei) return;
      const rg = eraRange(i);
      const l = xOfYear(rg.from) - x0, w = xOfYear(rg.to) - xOfYear(rg.from);
      const b = el('div', 'eraband', e.n); b.style.left = l + 'px'; b.style.width = w + 'px'; b.style.background = e.c;
      line.appendChild(b);
    });
    // bandes des sous-époques
    subs.forEach(function (sb) {
      const l = xOfYear(sb[1]) - x0, w = sb[3];
      const b = el('div', 'subband', w >= 58 ? sb[0] : ''); b.title = sb[0] + ' (' + yearLabel(sb[1]) + ' → ' + yearLabel(sb[2]) + ')';
      b.style.left = l + 'px'; b.style.width = w + 'px'; b.style.background = ERAS[sb[4]].c + 'B0';
      line.appendChild(b);
    });
    const axisY = 74;
    const axis = el('div', 'axis'); axis.style.top = axisY + 'px'; axis.style.width = W + 'px'; line.appendChild(axis);
    subs.forEach(function (sb, i) {
      const x = xOfYear(sb[1]) - x0;
      const t = el('div', 'tick'); t.style.left = x + 'px'; t.style.top = (axisY - 3) + 'px'; line.appendChild(t);
      if (i === 0 || sb[3] >= 58 || true) {
        const tl = el('div', 'tickl', sb[1] <= -100000 ? '' : yearLabel(sb[1])); tl.style.left = Math.max(14, x) + 'px'; tl.style.top = (axisY + 6) + 'px'; line.appendChild(tl);
      }
    });
    // repères : rangées pour éviter les chevauchements
    const LBL_W = 150, TIER_H = 64, TOP = axisY + 28;
    const placed = items.map(function (it) { return { it: it, x: xOfYear(it.y) - x0 }; }).sort(function (a, b) { return a.x - b.x; });
    const tiers = [];
    placed.forEach(function (pl) {
      const left = Math.min(Math.max(pl.x - 6, 0), Math.max(0, W - LBL_W));
      let t = 0;
      while (t < tiers.length && tiers[t] + 8 > left) t++;
      if (t >= 7) t = 6;
      tiers[t] = left + LBL_W;
      pl.t = t; pl.left = left;
    });
    placed.forEach(function (pl) {
      const it = pl.it, ty = TOP + pl.t * TIER_H;
      const stem = el('div', 'stem'); stem.style.left = pl.x + 'px'; stem.style.top = axisY + 'px'; stem.style.height = (ty - axisY) + 'px'; line.appendChild(stem);
      const mk = el('div', 'mk'); mk.style.left = pl.x + 'px'; mk.style.top = axisY + 'px'; mk.style.background = it.kind === 'person' ? '#D4AF6A' : '#7AA2F7'; line.appendChild(mk);
      const lb = el('button', 'lbl'); lb.type = 'button'; lb.style.left = pl.left + 'px'; lb.style.top = ty + 'px';
      lb.appendChild(el('b', null, yearLabel(it.y)));
      lb.appendChild(el('span', null, (it.kind === 'person' ? '👤 ' : '📅 ') + it.title));
      lb.addEventListener('click', function () { showLineDetail(it); });
      line.appendChild(lb);
    });
    line.style.width = (W + 20) + 'px';
    line.style.height = (TOP + Math.max(1, tiers.length) * TIER_H + 10) + 'px';
    wrap.appendChild(line);
    return { wrap: wrap, firstX: placed.length ? placed[0].x : 0 };
  }

  function viewMyLine(body) {
    body.appendChild(backBtn('Mes cours', function () { go('home'); }));
    body.appendChild(el('h2', 'ltitle', '🕰️ Ma frise chronologique'));
    body.appendChild(el('p', 'sub', 'Touche 🕰️ sur une carte : le personnage ou l\'événement se range dans la bonne époque.'));
    const bar = el('div', 'prow');
    bar.appendChild(pbtn('+ Ajouter un repère', '', function () {
      const t = prompt('Nom du personnage ou de l\'événement ?');
      if (!t || !t.trim()) return;
      const a = prompt('En quelle année ? (par exemple 1789, ou -44 pour 44 av. J.-C.)');
      if (a == null) return;
      const y = parseInt(String(a).trim(), 10);
      if (!isFinite(y) || y < -100000 || y > 2200 || y === 0) { toast('Année non valide'); return; }
      const person = confirm('C\'est un personnage ?\nOK = personnage, Annuler = événement');
      if (addToLine({ id: 'm:' + Date.now().toString(36), y: y, kind: person ? 'person' : 'event', title: t.trim().slice(0, 80), text: '', thumb: '', tag: '' })) renderStudy();
    }));
    bar.appendChild(pbtn('Ajouter mes cartes ♥', 'ghost', function () {
      let n = 0;
      Object.keys(saved).forEach(function (k) {
        const sv0 = saved[k], id = 'l:' + k;
        if (lineHas(id)) return;
        const y = guessYear({ extract: sv0.extract || sv0.gist });
        if (y == null) return;
        if (study.line.length < 300) { study.line.push({ id: id, y: y, kind: PERSON_RE.test(sv0.extract || '') ? 'person' : 'event', title: sv0.title, text: (sv0.gist || '').slice(0, 170), thumb: sv0.thumb || '', tag: '' }); n++; }
      });
      if (n) { saveStudy(); checkBadges(); saveProfile(); }
      toast(n ? n + ' carte' + (n > 1 ? 's' : '') + ' ajoutée' + (n > 1 ? 's' : '') + ' à ta frise' : 'Aucune carte ♥ avec une date trouvée');
      renderStudy();
    }));

    const mode = sv.lm || 'frise', f = sv.lf || 'all', ei = sv.le == null ? -1 : sv.le;
    const mk = function (label, active, fn) { const b = el('button', 'chip', label); b.type = 'button'; b.setAttribute('aria-pressed', active ? 'true' : 'false'); b.addEventListener('click', fn); return b; };
    const c1 = el('div', 'chips scrollx'); c1.style.margin = '12px -18px 8px';
    c1.append(mk('📏 Frise', mode === 'frise', function () { go('myline', { lm: 'frise' }); }), mk('📋 Liste', mode === 'liste', function () { go('myline', { lm: 'liste' }); }));
    [['all', 'Tout'], ['person', '👤 Personnages'], ['event', '📅 Événements']].forEach(function (x) { c1.appendChild(mk(x[1], f === x[0], function () { go('myline', { lf: x[0] }); })); });
    body.appendChild(c1);
    if (mode === 'frise') {
      const c3 = el('div', 'chips scrollx'); c3.style.margin = '0 -18px 14px';
      c3.appendChild(mk('Toutes les époques', ei < 0, function () { go('myline', { le: -1 }); }));
      ERAS.forEach(function (e, i) { c3.appendChild(mk(e.n, ei === i, function () { go('myline', { le: i }); })); });
      body.appendChild(c3);
    }

    let items = study.line.filter(function (x) { return f === 'all' || x.kind === f; });
    if (mode === 'frise' && ei >= 0) { const rg = eraRange(ei); items = items.filter(function (x) { return x.y >= rg.from && x.y < rg.to + (ei === 4 ? 1 : 0); }); }
    items.sort(function (a, b) { return a.y - b.y; });

    if (mode === 'frise') {
      const fr = buildFrise(items, ei);
      body.appendChild(fr.wrap);
      if (!items.length) body.appendChild(el('p', 'sub', 'Aucun repère dans cette partie de la frise. Sur une carte, touche 🕰️ pour y placer un personnage ou un événement.'));
      else body.appendChild(el('p', 'sub', items.length + ' repère' + (items.length > 1 ? 's' : '') + '. Fais glisser la frise de gauche à droite, touche un repère pour le détail. Doré = personnage, bleu = événement.'));
      requestAnimationFrame(function () { fr.wrap.scrollLeft = Math.max(0, fr.firstX - 30); });
      body.appendChild(bar);
      return;
    }
    if (!items.length) { body.appendChild(el('p', 'sub', 'Ta frise est vide pour l\'instant. Sur une carte, touche 🕰️ pour y placer un personnage ou un événement.')); body.appendChild(bar); return; }
    body.appendChild(el('p', 'sub', items.length + ' repère' + (items.length > 1 ? 's' : '') + ', du plus ancien au plus récent.'));
    const tl = el('div', 'tl');
    let lastC = null;
    items.forEach(function (x) {
      const c = eraOf(x.y);
      if (c !== lastC) { tl.appendChild(el('div', 'cent', c)); lastC = c; }
      const row = el('div', 'tli'); row.setAttribute('role', 'button');
      row.appendChild(el('span', 'tdot'));
      const box = el('div', 'tbox');
      const th = safeThumb(x.thumb);
      if (th) { const im = el('div', 'tth'); im.style.backgroundImage = 'url("' + th + '")'; box.appendChild(im); }
      box.appendChild(el('b', null, yearLabel(x.y)));
      box.appendChild(el('p', 'tt', (x.kind === 'person' ? '👤 ' : '📅 ') + x.title));
      if (x.text) box.appendChild(el('p', null, x.text));
      if (x.tag) box.appendChild(el('span', 'tls', '🏷️ ' + x.tag));
      row.appendChild(box);
      row.addEventListener('click', function () { showLineDetail(x); });
      tl.appendChild(row);
    });
    body.appendChild(tl);
    body.appendChild(bar);
  }

  function viewTimeline(body) {
    const c = courseOf();
    if (!c) { go('home'); return; }
    body.appendChild(backBtn(c.title, function () { go('course'); }));
    body.appendChild(el('h2', 'ltitle', '🕰️ Frise chronologique'));
    if (c.modules.length > 1) {
      const chips = el('div', 'chips'); chips.style.marginBottom = '18px';
      const mk = function (label, v) { const b = el('button', 'chip', label); b.type = 'button'; b.setAttribute('aria-pressed', sv.tm === v ? 'true' : 'false'); b.addEventListener('click', function () { go('timeline', { tm: v }); }); chips.appendChild(b); };
      mk('Tout le cours', -1);
      c.modules.forEach(function (m, mi) { mk('Ch. ' + (mi + 1), mi); });
      body.appendChild(chips);
    }
    const ev = timelineEvents(c, sv.tm == null ? -1 : sv.tm);
    if (!ev.length) { body.appendChild(el('p', 'sub', 'Pas assez de dates dans cette partie du cours.')); return; }
    body.appendChild(el('p', 'sub', ev.length + ' repères, du plus ancien au plus récent. Touche-en un pour relire la leçon.'));
    const tl = el('div', 'tl');
    ev.forEach(function (e) {
      const row = el('div', 'tli'); row.setAttribute('role', 'button');
      row.appendChild(el('span', 'tdot'));
      const box = el('div', 'tbox');
      box.appendChild(el('b', null, e.label));
      box.appendChild(el('p', null, e.text));
      box.appendChild(el('span', 'tls', 'Leçon ' + (e.li + 1)));
      const idl = 'tc:' + c.id + ':' + e.li + ':' + hashOf(e.text);
      const ad = el('button', 'sm ghost', lineHas(idl) ? '📍 Sur ma frise' : '📍 Ajouter à ma frise'); ad.type = 'button'; ad.style.marginTop = '8px';
      ad.addEventListener('click', function (ev2) {
        ev2.stopPropagation();
        if (lineHas(idl)) { toast('Déjà sur ta frise'); return; }
        if (addToLine({ id: idl, y: e.y, kind: 'event', title: e.text.length > 80 ? e.text.slice(0, 77).replace(/\s+\S*$/, '') + '…' : e.text, text: e.text.length > 80 ? e.text : '', thumb: c.thumb || '', tag: c.title })) { ad.textContent = '📍 Sur ma frise'; toast('📍 Ajouté à ta frise'); }
      });
      box.appendChild(ad);
      row.appendChild(box);
      row.addEventListener('click', function () { go('lesson', { li: e.li }); });
      tl.appendChild(row);
    });
    body.appendChild(tl);
  }

  async function searchFor(q) {
    go('nw', { q: q, res: null, msg: 'Recherche…' });
    try { sv.res = await wikiSearch(q); sv.msg = sv.res.length ? '' : 'Aucun résultat, essaie d\'autres mots-clés.'; }
    catch (e) { sv.msg = 'Impossible de chercher pour le moment.'; }
    renderStudy();
  }

  function openStudy() { sv.view = 'home'; sv.sess = null; sv.related = null; renderStudy(); studyPanel.classList.add('open'); studyPanel.scrollTop = 0; }
  document.getElementById('studyBtn').addEventListener('click', openStudy);
  syncDeckFromSaved();
  document.getElementById('closeStudy').addEventListener('click', function () { studyPanel.classList.remove('open'); const sh = document.getElementById('lineSheet'); if (sh) sh.remove(); });
  updateStudyBadge();
  setTimeout(function () {
    const n = dueCards().length;
    if (n && study.lastNag !== todayKey()) { study.lastNag = todayKey(); saveStudy(); toast('📚 ' + n + ' carte' + (n > 1 ? 's' : '') + ' à réviser aujourd\'hui. Touche le livre !'); }
    else if (!n && study.lastNag !== todayKey() && !(quizToday() && quizToday().done) && history.length >= 6) { study.lastNag = todayKey(); saveStudy(); toast('🎯 Ton quiz du jour t\'attend dans le livre !'); }
  }, 2500);

  if (!profile.hintSeen) { profile.hintSeen = 1; saveProfile(); setTimeout(function () { toast('👆 Glisse vers le haut pour la carte suivante'); }, 2000); }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  loadMore(4);
})();
