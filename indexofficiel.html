<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Curio">
<meta name="theme-color" content="#0B0F1A">
<meta name="referrer" content="no-referrer">
<title>Curio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
<style>
  :root {
    --ink: #0B0F1A;
    --ivory: #F4EFE4;
    --muted: #A9AEBB;
    --gold: #D4AF6A;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: -apple-system, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;  --w: 255,255,255; --ink-rgb: 11,15,26; --ivory-rgb: 244,239,228; --goldt: var(--gold); --card: #141B2E; --fs: 1;
  }
  :root[data-theme="light"] { --ink: #F6F2E9; --ivory: #1B2236; --muted: #5C6478; --goldt: #8A5F0A; --w: 20,28,50; --ink-rgb: 246,242,233; --ivory-rgb: 27,34,54; --card: #FFFFFF; color-scheme: light; }
  :root[data-theme="light"] .pbtn.danger { color: #B3261E; border-color: rgba(179,38,30,.5); }
  :root[data-theme="light"] .opt.good { background: rgba(46,160,90,.16); }
  :root[data-theme="light"] .opt.bad { background: rgba(200,60,60,.12); }
  .prevtxt { margin: 8px 0 0; font: calc(18px * var(--fs, 1))/1.5 var(--serif); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--ink); color: var(--ivory); font-family: var(--sans); overscroll-behavior: none; -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; }

  #feed { height: 100dvh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
  #feed::-webkit-scrollbar { display: none; }

  .card { position: relative; height: 100dvh; scroll-snap-align: start; scroll-snap-stop: always; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: calc(56px + env(safe-area-inset-bottom)); }
  .bg { position: absolute; inset: 0; }
  .bg .letter { position: absolute; right: -3vw; top: 10vh; font: 700 72vw/1 var(--serif); color: rgba(var(--w),.06); pointer-events: none; }
  .bg .blur { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(38px) saturate(1.25); transform: scale(1.1); opacity: 0; transition: opacity .8s ease; }
  .bg .blur.on { opacity: .55; }
  .frame { position: relative; flex: 1 1 0; min-height: 96px; max-height: 46dvh; margin: calc(72px + env(safe-area-inset-top)) 16px 20px; border-radius: 24px; overflow: hidden; background: rgba(var(--w),.04); box-shadow: 0 18px 50px rgba(0,0,0,.5), 0 0 0 1px rgba(var(--w),.12); opacity: 0; transition: opacity .7s ease; }
  .frame.on { opacity: 1; }
  .frame img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; }
  .shade { position: absolute; inset: 0; background:
      linear-gradient(to top, rgba(var(--ink-rgb),.98) 0%, rgba(var(--ink-rgb),.88) 30%, rgba(var(--ink-rgb),.25) 62%, rgba(var(--ink-rgb),0) 78%),
      linear-gradient(to bottom, rgba(var(--ink-rgb),.45) 0%, rgba(var(--ink-rgb),0) 14%); }

  .content { position: relative; padding: 0 86px 14px 22px; }
  .content h2 { margin: 0 0 8px; font: 700 clamp(30px, 8.6vw, 40px)/1.06 var(--serif); letter-spacing: -.015em; text-wrap: balance; }
  .content .desc { margin: 0 0 14px; font-size: 14.5px; color: var(--goldt); letter-spacing: .01em; }
  .content .text { margin: 0; font-size: calc(18px * var(--fs, 1)); line-height: 1.48; color: var(--ivory); }
  .morebtn { margin-top: 18px; height: 42px; padding: 0 20px; border-radius: 21px; border: 1px solid rgba(212,175,106,.55); background: rgba(212,175,106,.1); color: var(--goldt); font: 600 15px var(--sans); cursor: pointer; }
  .morebtn:active { transform: scale(.97); }

  .src { margin: 12px 0 0; font-size: 12.5px; color: var(--muted); }
  .note { margin: 0 0 12px; font-size: calc(13.5px * var(--fs, 1)); line-height: 1.45; color: var(--muted); }
  .long, .item .more { font: calc(18px * var(--fs, 1))/1.7 var(--serif); color: var(--ivory); }
  .long p, .item .more p { margin: 0 0 14px; }
  .long h4, .item .more h4 { margin: 24px 0 8px; font: 700 15px var(--sans); color: var(--goldt); }
  .long h4:first-child, .item .more h4:first-child { margin-top: 4px; }
  .long[hidden] { display: none; }
  .content.reading { position: absolute; left: 0; right: 0; bottom: 0; max-height: 80dvh; overflow-y: auto; padding: 26px 22px calc(36px + env(safe-area-inset-bottom)); background: rgba(var(--ink-rgb),.82); -webkit-backdrop-filter: blur(22px) saturate(1.2); backdrop-filter: blur(22px) saturate(1.2); border-radius: 28px 28px 0 0; border-top: 1px solid rgba(var(--w),.12); }
  .content.reading::before { content: ""; position: absolute; top: 9px; left: 50%; width: 40px; height: 4px; margin-left: -20px; border-radius: 2px; background: rgba(var(--w),.25); }
  .content.reading .text { display: none; }
  #credit { transition: opacity .25s; }
  body.reading-open #credit { opacity: 0; visibility: hidden; }
  .card.reading .actions { display: none; }

  .actions { position: absolute; right: 14px; bottom: calc(68px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .btn { width: 52px; height: 52px; border-radius: 50%; border: 1px solid rgba(var(--w),.2); background: rgba(var(--ink-rgb),.5); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: var(--ivory); display: grid; place-items: center; cursor: pointer; padding: 0; transition: background .2s, color .2s, border-color .2s; }
  .btn svg, .tbtn svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .btn:active { transform: scale(.93); }
  .btn.on { color: var(--goldt); border-color: var(--goldt); background: rgba(212,175,106,.16); }
  .btn.on svg { fill: currentColor; }
  .btn.pop { animation: pop .3s ease-out; }
  @keyframes pop { 50% { transform: scale(1.2); } }

  #top { position: fixed; left: 0; right: 0; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; padding: calc(12px + env(safe-area-inset-top)) 16px 14px; background: linear-gradient(to bottom, rgba(var(--ink-rgb),.6), transparent); pointer-events: none; }
  #top > * { pointer-events: auto; }
  .logo { font: 700 24px var(--serif); letter-spacing: -.01em; }
  .logo i { color: var(--goldt); font-style: normal; }
  .right { display: flex; gap: 10px; }
  .tbtn { position: relative; width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(var(--w),.2); background: rgba(var(--ink-rgb),.5); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: var(--ivory); display: grid; place-items: center; cursor: pointer; padding: 0; }
  .tbtn svg { width: 20px; height: 20px; }
  .badge { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--gold); color: #1A1406; font: 700 11px/18px var(--sans); text-align: center; }
  .badge:empty { display: none; }
  #credit { position: fixed; left: 0; right: 0; bottom: calc(6px + env(safe-area-inset-bottom)); z-index: 4; display: flex; flex-direction: column; align-items: center; line-height: 1; pointer-events: none; }
  #credit .by { font-size: .62em; color: var(--goldt); margin-right: .08em; }
  #credit .sig { margin-top: 1px; font-family: "Snell Roundhand", "Apple Chancery", "Segoe Script", "Brush Script MT", cursive; font-size: 34px; color: var(--ivory); transform: rotate(-3deg); white-space: nowrap; text-shadow: 0 2px 10px rgba(0,0,0,.55); }
  #credit svg { width: 130px; height: 10px; margin-top: -3px; fill: none; stroke: var(--gold); stroke-width: 1.4; stroke-linecap: round; transform: rotate(-1.5deg); }

  .center { height: 100dvh; scroll-snap-align: start; display: grid; place-items: center; text-align: center; padding: 32px; color: var(--muted); line-height: 1.5; }
  .center .big { font: 700 40px var(--serif); color: var(--ivory); margin-bottom: 10px; }
  .center .big i { color: var(--goldt); font-style: normal; }
  .center button { margin-top: 18px; height: 46px; padding: 0 26px; border-radius: 23px; border: 0; background: var(--gold); color: #1A1406; font: 700 16px var(--sans); cursor: pointer; }

  .sheetpanel { position: fixed; inset: 0; z-index: 10; background: var(--ink); overflow-y: auto; padding: calc(18px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom)); transform: translateY(100%); visibility: hidden; transition: transform .38s cubic-bezier(.2,.8,.2,1), visibility 0s .38s; }
  .sheetpanel.open { transform: none; visibility: visible; transition: transform .38s cubic-bezier(.2,.8,.2,1); }
  .sheetpanel header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .sheetpanel h1 { margin: 0; font: 700 28px var(--serif); letter-spacing: -.01em; }
  .close { height: 38px; padding: 0 16px; border-radius: 19px; border: 1px solid rgba(var(--w),.2); background: transparent; color: var(--ivory); font: 600 15px var(--sans); cursor: pointer; }

  .item { padding: 14px 0; border-bottom: 1px solid rgba(var(--w),.09); }
  .item .row { display: flex; gap: 14px; align-items: center; cursor: pointer; }
  .item .th { width: 64px; height: 64px; flex: none; border-radius: 14px; background: rgba(var(--w),.1) center/cover; display: grid; place-items: center; font: 700 26px var(--serif); color: rgba(var(--w),.5); }
  .item .box { flex: 1; min-width: 0; }
  .item .box b { display: block; font: 700 18px/1.25 var(--serif); }
  .item .box span { display: block; margin-top: 4px; font-size: calc(14px * var(--fs, 1)); line-height: 1.4; color: var(--muted); }
  .item .rm { border: 0; background: none; color: var(--muted); padding: 10px; cursor: pointer; font-size: 18px; }
  .item .more { margin: 14px 0 0; }
  .item .more[hidden] { display: none; }
  .empty { color: var(--muted); line-height: 1.55; }

  #search { width: 100%; height: 46px; border-radius: 23px; border: 1px solid rgba(var(--w),.2); background: rgba(var(--w),.05); color: var(--ivory); padding: 0 18px; font: 16px var(--sans); margin-bottom: 6px; }
  #search::placeholder { color: var(--muted); }
  .group { margin: 22px 0 0; }
  .group h3 { margin: 0 0 11px; font: 700 18px var(--serif); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 9px 14px; border-radius: 20px; border: 1px solid rgba(var(--w),.2); background: transparent; color: var(--ivory); font: 500 15px var(--sans); cursor: pointer; transition: background .15s, color .15s; }
  .chip[aria-pressed="true"] { background: var(--gold); color: #1A1406; border-color: var(--goldt); font-weight: 600; }
  .chip.hide, .group.hide { display: none; }
  #countrySelect { width: 100%; height: 50px; margin: 0 0 12px; padding: 0 16px; border-radius: 25px; border: 1px solid rgba(var(--w),.2); background: rgba(var(--w),.05); color: var(--ivory); font: 16px var(--sans); }
  #countrySelect option { color: #111; }
  #topicsFoot { position: sticky; bottom: 0; margin: 22px -18px 0; padding: 14px 18px calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--ink) 72%, transparent); display: flex; gap: 10px; }
  #topicsFoot button { height: 50px; border-radius: 25px; font: 700 16px var(--sans); cursor: pointer; }
  #applyTopics { flex: 1; border: 0; background: var(--gold); color: #1A1406; }
  #clearTopics { padding: 0 20px; border: 1px solid rgba(var(--w),.2); background: transparent; color: var(--ivory); font-weight: 600; }


  .tbtn .av { font-size: 20px; line-height: 1; }
  #toast { position: fixed; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom)); transform: translate(-50%, 16px); opacity: 0; z-index: 20; max-width: 88vw; padding: 10px 16px; border-radius: 20px; border: 1px solid var(--gold); background: rgba(var(--ink-rgb),.96); color: var(--ivory); font: 600 14px var(--sans); text-align: center; pointer-events: none; transition: opacity .3s, transform .3s; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  .sub { margin: 0 0 12px; font-size: calc(13.5px * var(--fs, 1)); line-height: 1.45; color: var(--muted); }
  .who + .sub { margin-top: 14px; }
  html, body { overflow-x: hidden; }
  h1, h2, h3, .lt, .ct b, .mhead b, .tbox p, .qtext, .lp, .fb p { overflow-wrap: anywhere; }
  .content { max-height: calc(100dvh - 250px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); overflow-y: auto; scrollbar-width: none; }
  .content::-webkit-scrollbar { display: none; }
  .content.reading { max-height: 80dvh; }
  .content.reading .morebtn { display: block; margin-top: 8px; margin-bottom: 14px; }

  .pcard { background: rgba(var(--w),.05); border: 1px solid rgba(var(--w),.1); border-radius: 22px; padding: 16px; margin-bottom: 14px; }
  .pcard h3 { margin: 0 0 12px; font: 700 17px var(--serif); }
  .pcard .sub { margin: -6px 0 12px; font-size: calc(13.5px * var(--fs, 1)); line-height: 1.45; color: var(--muted); }
  .who { display: flex; align-items: center; gap: 14px; }
  .who .avb { width: 66px; height: 66px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 34px; background: rgba(212,175,106,.14); border: 1px solid rgba(212,175,106,.55); }
  .who .nm { font: 700 23px var(--serif); letter-spacing: -.01em; }
  .who .lv { margin-top: 2px; font-size: 14px; color: var(--goldt); }
  .who .edit { margin-left: auto; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid rgba(var(--w),.2); background: transparent; color: var(--ivory); font: 600 14px var(--sans); cursor: pointer; }
  .xpbar { height: 8px; margin-top: 16px; border-radius: 4px; background: rgba(var(--w),.1); overflow: hidden; }
  .xpbar i { display: block; height: 100%; border-radius: 4px; background: var(--gold); transition: width .6s ease; }
  .xpnote { margin-top: 7px; font-size: 12.5px; color: var(--muted); }
  .goalrow { display: flex; align-items: center; gap: 16px; }
  .ring { position: relative; width: 88px; height: 88px; flex: none; }
  .ring svg { width: 88px; height: 88px; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 8; }
  .ring .bgc { stroke: rgba(var(--w),.1); }
  .ring .fgc { stroke: var(--gold); stroke-linecap: round; transition: stroke-dasharray .6s ease; }
  .ring .num { position: absolute; inset: 0; display: grid; place-items: center; font: 700 21px var(--serif); }
  .goalrow .txt { flex: 1; font-size: 15px; line-height: 1.45; }
  .goalrow .txt b { color: var(--goldt); }
  .gchips { display: flex; gap: 8px; margin-top: 10px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .tile { padding: 14px; border-radius: 18px; background: rgba(var(--w),.05); border: 1px solid rgba(var(--w),.1); }
  .tile .v { font: 700 28px var(--serif); }
  .tile .l { margin-top: 2px; font-size: 13px; color: var(--muted); }
  .week { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; height: 96px; }
  .week .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; height: 100%; }
  .week .bar { width: 100%; max-width: 30px; min-height: 4px; border-radius: 6px; background: rgba(var(--w),.14); }
  .week .bar.hit { background: var(--gold); }
  .week .d { font-size: 12px; color: var(--muted); }
  .week .d.today { color: var(--goldt); font-weight: 700; }
  .bgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .badge2 { padding: 12px; border-radius: 16px; border: 1px solid rgba(var(--w),.1); background: rgba(var(--w),.03); opacity: .45; }
  .badge2.on { opacity: 1; border-color: rgba(212,175,106,.6); background: rgba(212,175,106,.1); }
  .badge2 .e { font-size: 26px; }
  .badge2 b { display: block; margin-top: 4px; font: 700 15px var(--serif); }
  .badge2 span { display: block; margin-top: 2px; font-size: 12.5px; line-height: 1.35; color: var(--muted); }
  .rank { display: flex; align-items: center; gap: 10px; margin: 8px 0; font-size: 14.5px; }
  .rank .n { width: 110px; flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank .b { flex: 1; height: 8px; border-radius: 4px; background: rgba(var(--w),.08); overflow: hidden; }
  .rank .b i { display: block; height: 100%; background: var(--gold); border-radius: 4px; }
  .rank .c { width: 30px; text-align: right; color: var(--muted); font-size: 13px; }
  .pform label { display: block; margin: 0 0 8px; font-size: 14px; color: var(--muted); }
  .pform input[type=text], .pform textarea { width: 100%; border-radius: 16px; border: 1px solid rgba(var(--w),.2); background: rgba(var(--w),.05); color: var(--ivory); padding: 12px 16px; font: 16px var(--sans); }
  .pform textarea { min-height: 84px; resize: vertical; font-size: 13px; }
  .avgrid { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
  .avgrid button { width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(var(--w),.2); background: transparent; font-size: 24px; cursor: pointer; }
  .avgrid button[aria-pressed="true"] { border-color: var(--goldt); background: rgba(212,175,106,.2); }
  .pbtn { height: 46px; padding: 0 22px; border-radius: 23px; border: 0; background: var(--gold); color: #1A1406; font: 700 15.5px var(--sans); cursor: pointer; }
  .pbtn.ghost { border: 1px solid rgba(var(--w),.22); background: transparent; color: var(--ivory); font-weight: 600; }
  .pbtn.danger { border: 1px solid rgba(255,120,120,.5); background: transparent; color: #FF9B9B; font-weight: 600; }
  .prow { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .avatar { flex: none; border-radius: 50%; display: grid; place-items: center; background-size: cover; background-position: center; line-height: 1; }
  .tbtn .avatar { box-shadow: none !important; }
  .pcard h4 { margin: 16px 0 8px; font: 600 14px var(--sans); color: var(--muted); letter-spacing: .02em; }
  .pcard.cta { border-color: rgba(212,175,106,.5); background: rgba(212,175,106,.08); }
  .pcard.prestige { border-color: rgba(212,175,106,.7); background: linear-gradient(160deg, rgba(212,175,106,.18), rgba(212,175,106,.04)); }
  .who .pres { margin-top: 3px; font: 700 13.5px var(--sans); letter-spacing: .02em; }
  .msg { margin: 0 0 12px; padding: 10px 12px; border-radius: 12px; background: rgba(var(--w),.07); font-size: 14px; line-height: 1.4; }
  .fld { margin-bottom: 12px; }
  .fld label { display: block; margin: 0 0 6px; font-size: 13.5px; color: var(--muted); }
  .fld input, .addrow input { width: 100%; border-radius: 16px; border: 1px solid rgba(var(--w),.2); background: rgba(var(--w),.05); color: var(--ivory); padding: 12px 16px; font: 16px var(--sans); }
  .consent { display: flex; align-items: flex-start; gap: 10px; margin: 6px 0 4px; font-size: 13.5px; line-height: 1.4; color: var(--muted); cursor: pointer; }
  .consent input { width: 20px; height: 20px; flex: none; margin-top: 1px; accent-color: #D4AF6A; }
  .lnk { border: 0; background: none; padding: 0; color: var(--goldt); font: 600 14px var(--sans); text-decoration: underline; cursor: pointer; }
  .prow.links { flex-direction: column; align-items: flex-start; gap: 12px; margin-top: 16px; }
  .prev { display: flex; justify-content: center; margin: 4px 0 6px; }
  .colgrid { display: flex; flex-wrap: wrap; gap: 10px; margin: 4px 0 14px; }
  .colgrid button { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
  .colgrid button[aria-pressed="true"] { border-color: var(--ivory); box-shadow: 0 0 0 2px var(--ink) inset; }
  .addrow { display: flex; gap: 10px; align-items: center; }
  .addrow .pbtn { flex: none; padding: 0 18px; }
  .frow { display: flex; align-items: center; gap: 12px; padding: 10px 6px; border-radius: 14px; }
  .frow.me { background: rgba(212,175,106,.12); }
  .frow .rk { width: 26px; flex: none; text-align: center; font: 700 15px var(--serif); color: var(--muted); }
  .frow .ft { flex: 1; min-width: 0; }
  .frow .ft b { display: block; font: 700 16px var(--serif); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .frow .ft span { display: block; margin-top: 2px; font-size: 12.5px; color: var(--muted); }
  .frow .live { display: inline-block; width: 8px; height: 8px; margin-left: 7px; border-radius: 50%; background: #5BD98A; vertical-align: middle; }
  .fbtns { display: flex; gap: 6px; flex: none; }
  .sm { height: 34px; padding: 0 12px; border-radius: 17px; border: 0; background: var(--gold); color: #1A1406; font: 700 13px var(--sans); cursor: pointer; }
  .sm.ghost { border: 1px solid rgba(var(--w),.22); background: transparent; color: var(--ivory); font-weight: 600; }

  async function searchTopic(key) {
    const cat = TOPICS[key];
    const label = key.replace(/^\S+\s/, '');
    let off = Math.floor(Math.random() * 400);
    for (let t = 0; t < 4; t++) {
      const q = t < 3 ? 'deepcat:"' + cat + '"' : label;
      const url = WIKI + '?action=query&format=json&origin=*&formatversion=2' +
        '&generator=search&gsrnamespace=0&gsrlimit=20&gsroffset=' + off + '&gsrsearch=' + encodeURIComponent(q) +
        '&prop=extracts|pageimages|description&exintro=1&explaintext=1&exsentences=5&exlimit=max' +
        '&piprop=thumbnail&pithumbsize=960';
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const j = await res.json();
      const pages = (j.query && j.query.pages) || [];
      const good = pages.map(function (p) { return wikiItem('fr.wikipedia.org', 'wikipedia', p); }).filter(function (d) {
        return d.extract.length >= 140 && !/peut (désigner|faire référence)/i.test(d.extract) && !seenIds.has(d.pageid) && (t < 3 || norm(d.title + ' ' + d.extract).indexOf(norm(label).slice(0, 5)) >= 0);

      if (good.length) {
        const withImg = good.filter(function (d) { return d.thumbnail; });
        return shuffle(withImg.length ? withImg : good);
      }
      off = Math.floor(off / 4);
    }
    return [];
  }

  async function nextFromPool(key, fill) {
    const g = gen;
    if (!pools[key] || !pools[key].length) {
      if (!pending[key]) {
        pending[key] = fill().then(function (arr) { if (g === gen) pools[key] = (pools[key] || []).concat(arr); }).finally(function () { delete pending[key]; });
      }
      await pending[key];
    }
    const arr = pools[key] || [];
    while (arr.length) {
      const d = arr.shift();
      if (!seenIds.has(d.pageid)) { seenIds.add(d.pageid); return d; }
    }
    throw new Error('Source vide');
  }

  // Wikipédia et Wikivoyage : article au hasard
  async function wikiRandom(host, src, minLen) {
    for (let attempt = 0; attempt < 10; attempt++) {
      const res = await fetch('https://' + host + '/api/rest_v1/page/random/summary?r=' + Math.random());
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const d = await res.json();
      if (d.type !== 'standard' || !d.extract || d.extract.length < minLen) continue;
      const item = wikiItem(host, src, d);
      if (seenIds.has(item.pageid)) continue;
      if (!d.thumbnail && attempt < 7) continue;
      seenIds.add(item.pageid);
      return item;
    }
    throw new Error('Rien de bon trouvé');
  }

    const res = await fetch('https://fr.wikipedia.org/api/rest_v1/feed/onthisday/events/' + mm + '/' + dd);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    const out = [];
    (j.events || []).forEach(function (ev) {
      const pg = (ev.pages || [])[0];
      if (!pg || !ev.text || !pg.pageid) return;
      const title = (pg.titles && pg.titles.normalized) || pg.title;
      const ago = now.getFullYear() - ev.year;
      const lead = ev.text.trim().replace(/([^.!?])$/, '$1.').replace(/^\S/, function (ch) { return ch.toUpperCase(); });
      out.push({ type: 'standard', pageid: 'day:' + ev.year + ':' + pg.pageid, wid: pg.pageid, host: 'fr.wikipedia.org', source: 'day',
        title: title, description: now.getDate() + ' ' + MOIS[now.getMonth()] + ' ' + ev.year + (ago > 0 ? ', il y a ' + ago + ' ans' : ''),
        lead: lead, year: ev.year, extract: lead + ' ' + (pg.extract || ''), thumbnail: pg.thumbnail || null });
    });
    const withImg = out.filter(function (d) { return d.thumbnail; });
    return shuffle(withImg.length >= 5 ? withImg : out);
  }

      }
    }
    return [];
  }

  async function searchCustom(theme, allowSeen) {
    const tries = ['morelike:' + theme, theme];
    let all = [];
    for (let t = 0; t < tries.length; t++) {
      const off = t === 1 ? Math.floor(Math.random() * 20) : 0;
      const url = WIKI + '?action=query&format=json&origin=*&formatversion=2' +
        '&generator=search&gsrnamespace=0&gsrlimit=20&gsroffset=' + off + '&gsrsearch=' + encodeURIComponent(tries[t]) +
        '&prop=extracts|pageimages|description&exintro=1&explaintext=1&exsentences=5&exlimit=max&piprop=thumbnail&pithumbsize=960';
      try {
        const res = await fetch(url);
        if (!res.ok) continue;
        const j = await res.json();
        const items = ((j.query && j.query.pages) || []).map(function (p) { return wikiItem('fr.wikipedia.org', 'wikipedia', p); }).filter(function (d) {
          return d.extract.length >= 140 && !/peut (désigner|faire référence)/i.test(d.extract) && (allowSeen || !seenIds.has(d.pageid));
        });
        all = all.concat(items);
      } catch (e) {}
    }
    const seen = {};
    all = all.filter(function (d) { if (seen[d.pageid]) return false; seen[d.pageid] = 1; return true; });
    const words = norm(theme).split(/\s+/).map(function (w) { return w.replace(/[^a-z]/g, '').slice(0, 5); }).filter(function (w) { return w.length >= 4; });
    const on = words.length ? all.filter(function (d) { const tx = norm(d.title + ' ' + d.extract); return words.some(function (w) { return tx.indexOf(w) >= 0; }); }) : all;
    const pool = on.length >= 3 ? on : all;
    const withImg = pool.filter(function (d) { return d.thumbnail; });
    return shuffle(withImg.length >= 4 ? withImg : pool);
  }

  // les catégories / thèmes choisis (avec ou sans pays)
  function filterKinds() {
    const kinds = [];
    countryCats.forEach(function (id) { kinds.push({ t: 'ccat', id: id }); });
    selected.forEach(function (key) { kinds.push({ t: 'topic', key: key }); });
    selectedCustom.forEach(function (th) { kinds.push({ t: 'custom', th: th }); });
    return kinds;
  }
  function catOf(id) { return COUNTRY_CATS.filter(function (c) { return c[0] === id; })[0] || COUNTRY_CATS[0]; }
  function plainLabel(k) { return k.replace(/^\S+\s/, ''); }

  function pickSource() {
    // un pays ou des catégories choisis : on ne montre QUE ça (les sources mélangées sont ignorées)
    if (country || filterKinds().length) return 'filtered';
    const ids = selectedSources.length ? selectedSources : SOURCES.map(function (x) { return x[0]; });
    let total = 0;
    ids.forEach(function (id) { total += WEIGHT[id]; });
    let r = Math.random() * total;
    for (let i = 0; i < ids.length; i++) { r -= WEIGHT[ids[i]]; if (r <= 0) return ids[i]; }
    return ids[0];
  }

  async function fetchFrom(src) {
    if (src === 'wikipedia') return wikiRandom('fr.wikipedia.org', 'wikipedia', 140);
    if (src === 'voyage') return wikiRandom('fr.wikivoyage.org', 'voyage', 120);
    if (src === 'day') return nextFromPool('day', fillDay);
    return nextFromPool('births', fillBirths);
  }

  // catégorie choisie sans pays : des cartes de cette catégorie, venant de n'importe quel pays
  async function worldCat(cat) {
    for (let i = 0; i < 6; i++) {
      const nm = pick(COUNTRIES);
      try {
        const d = await nextFromPool('wc:' + cat[0] + '|' + nm, function () { return searchCountry(nm, cat[2], cat[0]); });
        d.countryName = nm;
        return d;
      } catch (e) { /* ce pays n'a rien sur ce sujet : on en essaie un autre */ }
    }
    throw new Error('Source vide');
  }

  async function fetchFiltered() {
    const kinds = filterKinds();
    if (country) {
      // un pays : uniquement ce pays, dans les catégories choisies (ou tous ses domaines)
      const nm = country;
      const kd = kinds.length ? pick(kinds) : { t: 'ccat', id: pick(COUNTRY_CATS.map(function (c) { return c[0]; })) };
      let d;
      if (kd.t === 'ccat') {
        const cat = catOf(kd.id);
        d = await nextFromPool('country:' + nm + '|' + cat[0], function () { return searchCountry(nm, cat[2], cat[0]); });
        d.topicKey = plainLabel(cat[1]);
      } else {
        const th = kd.t === 'topic' ? plainLabel(kd.key) : kd.th;
        d = await nextFromPool('cc:' + nm + '|' + th, function () { return searchCountry(nm, th); });
        d.topicKey = th;
      }
      d.countryName = nm;
      return d;
    }
    // pas de pays : uniquement les catégories choisies, dans le monde entier
    const kd = pick(kinds);
    if (kd.t === 'ccat') { const cat = catOf(kd.id); const dw = await worldCat(cat); dw.topicKey = plainLabel(cat[1]); return dw; }
    if (kd.t === 'topic') { const dt = await nextFromPool('topic:' + kd.key, function () { return searchTopic(kd.key); }); dt.topicKey = plainLabel(kd.key); return dt; }
    const dc = await nextFromPool('custom:' + kd.th, function () { return searchCustom(kd.th); });
    dc.topicKey = kd.th;
    return dc;
  }

  async function fetchNext() {
    let last = null;
    for (let i = 0; i < 5; i++) {
      const src = pickSource();
      try {
        if (src === 'filtered') return await fetchFiltered();
        return await fetchFrom(src);
      } catch (e) { last = e; }
    }
    throw last || new Error('Rien trouvé');
  }

  // --- texte : l'essentiel d'abord, le détail à la demande
  function cleanText(t) {
    return String(t || '').replace(/\[\d+\]/g, '')
      .replace(/\s*\(([^()]*)\)/g, function (m, inner) {
        return (inner.length > 40 || /\/|prononc|\bAPI\b|\bAFI\b|\bdit\b/i.test(inner)) ? '' : m;
      })
      .replace(/[ \t]{2,}/g, ' ').trim();
  }
  function splitSentences(text) {
    const guarded = text
      .replace(/\bJ\.-C\./g, 'J\u0001-C\u0001')
      .replace(/\b(av|apr|env|St|Ste|Mme|Mlle|Dr|Mgr|MM|vs|cf|éd|dir|M|etc)\./g, '$1\u0001')
      .replace(/\b([A-ZÀ-Ý])\./g, '$1\u0001');
    const out = [];
    const re = /[.!?]+["»”)]?\s+(?=[A-ZÀ-ÝŒ«"“(\d])/g;
    let last = 0, m;
    while ((m = re.exec(guarded))) { out.push(guarded.slice(last, m.index + m[0].length)); last = re.lastIndex; }
    out.push(guarded.slice(last));
    return out.map(function (x) { return x.replace(/\u0001/g, '.').trim(); }).filter(Boolean);
  }
  function gist(extract) {
    const sentences = splitSentences(cleanText(extract).replace(/\s+/g, ' '));
    const lim = LEVEL === 'simple' ? 150 : LEVEL === 'detail' ? 360 : 220;
    const minLen = LEVEL === 'simple' ? 0 : LEVEL === 'detail' ? 240 : 90;
    let out = sentences[0] || '';
    for (let i = 1; i < sentences.length && i < 3 && out.length < minLen; i++) out += ' ' + sentences[i];
    if (out.length > lim) out = out.slice(0, lim - 3).replace(/\s+\S*$/, '') + '…';
    return out;
  }
  // texte détaillé : paragraphes courts de 2 phrases, titres de parties, sans les notes et références
  function renderLong(el, raw) {
    el.textContent = '';
    const lines = cleanText(raw).split(/\n+/).map(function (x) { return x.trim(); }).filter(Boolean);
    let size = 0;
    for (let k = 0; k < lines.length; k++) {
      const line = lines[k];
      const heading = line.length < 60 && !/[.!?:;,]$/.test(line);
      if (heading) {
        if (/^(Notes?( et références)?|Références?|Voir aussi|Liens externes|Bibliographie|Articles connexes|Sources?)$/i.test(line)) break;
        if (k === lines.length - 1) break;
        const h = document.createElement('h4');
        h.textContent = line;
        el.appendChild(h);
        continue;
      }
      const sentences = splitSentences(line);
      for (let n = 0; n < sentences.length; n += 2) {
        const p = document.createElement('p');
        p.textContent = sentences.slice(n, n + 2).join(' ');
        el.appendChild(p);
        size += p.textContent.length;
      }
      if (size > 3600) break;
    }
    if (!el.firstChild) el.textContent = cleanText(raw);
  }

  // version simplifiée : Vikidia, l'encyclopédie pour les jeunes lecteurs (quand l'article existe)
  const simpleCache = {};
  async function fetchSimple(title) {
    if (!title) return null;
    if (title in simpleCache) return simpleCache[title];
    let out = null;
    try {
      const r = await fetch('https://fr.vikidia.org/w/api.php?action=query&format=json&origin=*&formatversion=2&redirects=1&prop=extracts&exintro=1&explaintext=1&titles=' + encodeURIComponent(title));
      const j = await r.json();
      const p = j.query && j.query.pages && j.query.pages[0];
      if (p && !p.missing && p.extract && p.extract.length >= 80) out = p.extract.trim();
    } catch (e) {}
    simpleCache[title] = out;
    return out;
  }

  const longCache = {};
  async function fetchLong(d) {
    const ck = LEVEL + ':' + d.pageid;
    if (longCache[ck]) return longCache[ck];
    let base = d.longText || '';
    if (LEVEL === 'simple' && !base) { const sx = d.simple || await fetchSimple(d.title); if (sx) { base = sx; d.simple = sx; } }
    let wid = d.wid, host = d.host;
    if (!wid && typeof d.pageid === 'number') { wid = d.pageid; host = 'fr.wikipedia.org'; }
    if (!base && wid && host) {
      try {
        const r = await fetch('https://' + host + '/w/api.php?action=query&format=json&origin=*&formatversion=2&prop=extracts&explaintext=1&exsectionformat=plain&pageids=' + wid);
        const j = await r.json();
        const t = j.query && j.query.pages && j.query.pages[0] && j.query.pages[0].extract;
        if (t) base = t.trim().slice(0, 9000);
      } catch (e) {}
    }
    if (!base) base = d.extract || '';
    const out = (d.lead ? d.lead.trim() + '\n\n' : '') + base;
    longCache[ck] = out;
    return out;
  }

  // --- images : plusieurs tailles essayées, la première qui charge gagne
  function imageUrls(d) {
    if (d.images) return d.images;
    if (!d.thumbnail || !d.thumbnail.source) return [];
    const t = d.thumbnail.source;
    if (!/\/\d+px-/.test(t)) return [t];
    return [t.replace(/\/\d+px-/, '/960px-'), t.replace(/\/\d+px-/, '/500px-'), t];
  }
  function applyImage(blurEl, frame, img, urls) {
    (function tryNext(i) {
      if (i >= urls.length) return;
      const im = new Image();
      im.referrerPolicy = 'no-referrer';
      im.onload = function () {
        img.src = urls[i];
        blurEl.style.backgroundImage = 'url("' + urls[i] + '")';
        blurEl.classList.add('on');
        frame.classList.add('on');
      };
      im.onerror = function () { tryNext(i + 1); };
      im.src = urls[i];
    })(0);
  }

        lg.hidden = true;
        content.classList.remove('reading');
        card.classList.remove('reading');
        document.body.classList.remove('reading-open');
        content.scrollTop = 0;
        mb.textContent = 'Lire plus';
      }
    });
    content.append(mb, lg);

    const actions = document.createElement('div');
    actions.className = 'actions';
    const heart = document.createElement('button');
    heart.className = 'btn' + (saved[d.pageid] ? ' on' : '');
    heart.dataset.pid = d.pageid;
    heart.setAttribute('aria-label', 'Sauvegarder');
    heart.innerHTML = HEART;
    heart.addEventListener('click', function () {
      if (saved[d.pageid]) {
        delete saved[d.pageid];

        colRemoveEverywhere(d.pageid);

        saved[d.pageid] = { pageid: d.pageid, wid: d.wid || null, host: d.host || null, source: d.source, lead: d.lead || null, longText: d.longText || null, title: d.title, gist: gist(d.extract), extract: d.extract, thumb: imageUrls(d).slice(-1)[0] || null };
        deckAdd(saved[d.pageid]);

    const tlb = document.createElement('button');
    tlb.className = 'btn' + (lineHas('l:' + d.pageid) ? ' on' : '');

    tlb.addEventListener('click', function () { placeOnLine(d, tlb); });

    cfb.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 7.5C3 6.7 3.7 6 4.5 6H9l2 2.5h8.5c.8 0 1.5.7 1.5 1.5v8c0 .8-.7 1.5-1.5 1.5h-15C3.7 19.5 3 18.8 3 18z"/></svg>';
    cfb.addEventListener('click', function () { openCollectionSheet(d); });

  function showError() {
    const old = document.getElementById('err');
    if (old) old.remove();
    const e = document.createElement('div');
    e.className = 'center';
    e.id = 'err';
    e.innerHTML = country
      ? '<div>Aucune carte trouvée pour ' + country.replace(/&/g, '&amp;').replace(/</g, '&lt;') + (filterKinds().length ? ' dans ces catégories' : '') + '.<br>Essaie une autre catégorie ou un autre pays.<br><button type="button">Réessayer</button></div>'
      : (filterKinds().length ? '<div>Aucune carte trouvée pour ces catégories.<br>Essaie-en d\'autres.<br><button type="button">Réessayer</button></div>' : '<div>Impossible de charger les cartes.<br>Vérifie ta connexion.<br><button type="button">Réessayer</button></div>');
    e.querySelector('button').addEventListener('click', function () { e.remove(); loadMore(3); });
    feed.appendChild(e);
    e.scrollIntoView();
  }

  async function loadMore(n) {
    if (loading) return;
    loading = true;
    const g = gen;
    try {
      const results = await Promise.allSettled(Array.from({ length: n }, fetchNext));
      if (g !== gen) return;
      let ok = 0;
      for (const r of results) {
        if (r.status === 'fulfilled') {
          const card = makeCard(r.value);
          feed.appendChild(card);
          observer.observe(card);
          ok++;
        }
      }
      const l = document.getElementById('loader');
      if (l) l.remove();
      if (!ok) showError();
    } catch (e) {
      showError();
    } finally {
      if (g === gen) loading = false;
    }
  }

  const observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (!en.isIntersecting) return;
      document.body.classList.toggle('reading-open', en.target.classList.contains('reading'));
      const idx = +en.target.dataset.idx;
      if (en.target._d && !en.target.dataset.counted) { en.target.dataset.counted = '1'; track(en.target._d); }
      if (idx >= cardCount - 3) loadMore(3);
    });
  }, { root: feed, threshold: 0.6 });

  // --- sauvegardés (tout se lit dans l'appli)

    const bar = document.createElement('div'); bar.className = 'chips scrollx'; bar.style.margin = '0 -18px 14px';
    bar.appendChild(mkChip('Toutes (' + keys.length + ')', savedFilter === 'all', function () { savedFilter = 'all'; renderSaved(); }));
    collections.forEach(function (c) { bar.appendChild(mkChip(c.emoji + ' ' + c.name + ' (' + c.ids.filter(function (id) { return saved[id]; }).length + ')', savedFilter === c.id, function () { savedFilter = c.id; renderSaved(); })); });
    bar.appendChild(mkChip('+ Nouvelle collection', false, function () {
      const n = prompt('Nom de la collection ? (par exemple « Voyage 2027 »)');

      act.append(
        mk('🎯 Quiz', '', function () { quizOnCollection(col); }),

        mk('Renommer', 'ghost', function () { const n = prompt('Nouveau nom ?', col.name); if (n && n.trim()) { col.name = n.trim().slice(0, 30); colSave(); renderSaved(); } }),
        mk('Supprimer', 'ghost', function () { if (!confirm('Supprimer la collection « ' + col.name + ' » ? Les cartes restent sauvegardées.')) return; collections = collections.filter(function (c) { return c.id !== col.id; }); savedFilter = 'all'; colSave(); renderSaved(); })
      );

    }

      box.className = 'box';
      const b = document.createElement('b');
      b.textContent = s.title;
      const sp = document.createElement('span');
      sp.textContent = s.gist || '';
      box.append(b, sp);
      const tags = collections.filter(function (c) { return c.ids.indexOf(k) >= 0; });
      if (tags.length) { const tg = document.createElement('span'); tg.textContent = tags.map(function (c) { return c.emoji + ' ' + c.name; }).join(' · '); tg.style.color = 'var(--goldt)'; box.appendChild(tg); }
      const fold = document.createElement('button');
      fold.className = 'rm';
      fold.setAttribute('aria-label', 'Ranger dans une collection');
      fold.textContent = '📁';

      rm.textContent = '✕';
      rm.addEventListener('click', function (ev) {
        ev.stopPropagation();
        delete saved[k];
        deckRemove(k);

        updateCount();
        renderSaved();

      });
      row.append(th, box, fold, rm);

  function newProfile() {
    return { owner: null, name: '', avatar: '', avatarColor: '', avatarUrl: '', goal: 10, xp: 0, cycleBase: 0, prestige: 0, seen: 0, read: 0, days: {}, bySource: {}, byTopic: {}, byCountry: {}, badges: {} };
  }
  let profile = Object.assign(newProfile(), load('curio.profile', {}));
  if (!profile.name) { profile.name = META.name || ''; profile.avatar = profile.avatar || META.avatar || ''; profile.avatarColor = profile.avatarColor || META.color || ''; if (META.photo) profile.avatarUrl = META.photo; }
  let editingProfile = false;

  function saveMeta() {
    try {
      const list = JSON.parse(localStorage.getItem('curio.profiles') || '[]');
      const m = list.filter(function (x) { return x.id === UID; })[0];
      if (m) { m.name = profile.name || m.name; m.avatar = profile.avatar || m.avatar; m.color = profile.avatarColor || m.color; m.photo = profile.avatarUrl || ''; m.level = LEVEL; m.age = META.age; localStorage.setItem('curio.profiles', JSON.stringify(list)); }
    } catch (e) {}
  }
  function saveProfile() { store('curio.profile', profile); saveMeta(); }
  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function dayKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function safeUrl(u) { return (typeof u === 'string' && /^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(u) && u.length < 120000) ? u : ''; }

  // --- niveaux et prestiges
  function needXp(n) { return Math.round(40 * Math.pow(n - 1, 1.6)); }
  function titleFor(n) { let t = TITLES[0][1]; TITLES.forEach(function (x) { if (n >= x[0]) t = x[1]; }); return t; }
  function prestigeName(p) { if (p <= 0) return ''; return p <= PRESTIGE_NAMES.length ? PRESTIGE_NAMES[p - 1] : 'Légende ' + (p - PRESTIGE_NAMES.length + 1); }
  function prestigeColor(p) { return PCOL[Math.min(Math.max(p, 1), PCOL.length) - 1]; }
  function levelInfo(xp, base) {
    const c = Math.max(0, (xp || 0) - (base || 0));
    let n = 1;
    while (n < MAX_LEVEL && c >= needXp(n + 1)) n++;
    const lo = needXp(n);
    const hi = n < MAX_LEVEL ? needXp(n + 1) : null;
    return { n: n, name: titleFor(n), cur: c, lo: lo, hi: hi, max: n >= MAX_LEVEL, pct: hi ? Math.round((c - lo) / (hi - lo) * 100) : 100 };
  }
  function gain(n) { return Math.max(n, Math.round(n * (1 + 0.1 * (profile.prestige || 0)))); }

  // --- annonces
  const toastEl = document.createElement('div');

  function nextToast() {
    const m = toasts.shift();

    toastBusy = true;

  // --- série, badges, suivi
  function streakInfo() {
    const goal = profile.goal || 10;
    const hit = function (k) { return (profile.days[k] || 0) >= goal; };
    let cur = 0;
    const d = new Date();
    if (!hit(dayKey(d))) d.setDate(d.getDate() - 1);
    while (hit(dayKey(d))) { cur++; d.setDate(d.getDate() - 1); }
    const keys = Object.keys(profile.days).filter(hit).sort();
    let best = 0, run = 0, prev = null;
    keys.forEach(function (k) {
      const t = new Date(k + 'T12:00:00');
      if (prev && Math.round((t - prev) / 86400000) === 1) run++; else run = 1;
      prev = t;
      if (run > best) best = run;
    });
    return { cur: cur, best: Math.max(best, cur) };
  }

  function checkBadges() {
    const c = { cols: (typeof collections !== 'undefined' ? collections.length : 0), filed: (function () { const m = {}; if (typeof collections !== 'undefined') collections.forEach(function (k) { k.ids.forEach(function (i) { m[i] = 1; }); }); return Object.keys(m).length; })(), line: (typeof study !== 'undefined' && study.line ? study.line.length : 0), friends: (typeof friends !== 'undefined' ? friends.length : 0), best: streakInfo().best, saved: Object.keys(saved).length, dom: (typeof domainCounts === 'function') ? domainCounts() : {}, mastered: (typeof study !== 'undefined') && study.badges.some(function (b) { return !!b.diamant; }) };
    BADGES.forEach(function (b) {

  function bump(map, key) { if (key) map[key] = (map[key] || 0) + 1; }

  }

  function track(d) {
    recordHistory(d);
    const before = levelInfo(profile.xp, profile.cycleBase).n;
    const k = dayKey(new Date());
    profile.seen++;
    profile.xp += gain(1);
    profile.days[k] = (profile.days[k] || 0) + 1;
    bump(profile.bySource, d.source);
    bump(profile.byTopic, d.topicKey);
    bump(profile.byCountry, d.countryName);
    weekBump('cards'); if (d.topicKey) weekBump('topics', d.topicKey); if (d.countryName) weekBump('countries', d.countryName);

    checkBadges();
    saveProfile();
    updateProfileBtn();
  }

  // --- synchronisation avec le compte
  function topList(map, limit) {

  }

  function rankBlock(title, sub, entries, labelOf) {
    const card = el('div', 'pcard');
    card.appendChild(el('h3', null, title));
    if (!entries.length) { card.appendChild(el('p', 'sub', sub)); return card; }
    const max = entries[0][1];
    entries.forEach(function (e) {
      const row = el('div', 'rank');
      row.appendChild(el('span', 'n', labelOf ? labelOf(e[0]) : e[0]));
      const b = el('span', 'b'); const i = el('i'); i.style.width = Math.max(6, Math.round(e[1] / max * 100)) + '%'; b.appendChild(i);
      row.appendChild(b);
      row.appendChild(el('span', 'c', String(e[1])));
      card.appendChild(row);
    });
    return card;
  }

  function field(labelText, id, type, value, attrs) {
    const w = el('div', 'fld');

  async function fileToSquareBlob(file, size) {
    let src;
    try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
    catch (e) {
      src = await new Promise(function (res, rej) { const im = new Image(); im.onload = function () { res(im); }; im.onerror = rej; im.src = URL.createObjectURL(file); });
    }
    const w = src.width || src.naturalWidth, h = src.height || src.naturalHeight, s = Math.min(w, h);
    const cv = document.createElement('canvas');
    cv.width = cv.height = size;
    cv.getContext('2d').drawImage(src, (w - s) / 2, (h - s) / 2, s, s, 0, 0, size, size);
    return await new Promise(function (res) { cv.toBlob(res, 'image/jpeg', 0.86); });
  }

  // ---- crédits des images (auteur et licence, ce que demandent les licences libres) ----
  const creditCache = {};
  function imageFileInfo(url) {
    const m = /upload\.wikimedia\.org\/wikipedia\/(commons|[a-z-]+)\/(?:thumb\/)?[0-9a-f]\/[0-9a-f]{2}\/([^\/?#]+)/.exec(String(url || ''));
    if (!m) return null;
    let file = m[2];
    try { file = decodeURIComponent(file); } catch (e) {}
    return { host: m[1] === 'commons' ? 'commons.wikimedia.org' : m[1] + '.wikipedia.org', file: file };
  }
  async function fetchImageCredit(url) {
    const fi = imageFileInfo(url);
    if (!fi) return null;
    const key = fi.host + '|' + fi.file;
    if (key in creditCache) return creditCache[key];
    let out = null;
    try {
      const r = await fetch('https://' + fi.host + '/w/api.php?action=query&format=json&origin=*&formatversion=2&prop=imageinfo&iiprop=extmetadata&titles=' + encodeURIComponent('File:' + fi.file));
      const j = await r.json();
      const pg = j.query && j.query.pages && j.query.pages[0];
      const md = pg && pg.imageinfo && pg.imageinfo[0] && pg.imageinfo[0].extmetadata;
      if (md) {
        const g = function (k) { return md[k] && md[k].value ? strip(String(md[k].value)) : ''; };
        out = { artist: g('Artist') || g('Credit'), license: g('LicenseShortName'), desc: g('ImageDescription'), file: fi.file, commons: fi.host === 'commons.wikimedia.org' };
      }
    } catch (e) {}
    creditCache[key] = out;
    return out;
  }

  async function importCode(text) {
    const t = String(text).trim();

      const o = JSON.parse(decodeURIComponent(escape(atob(t.slice(7)))));
      if (!o || typeof o !== 'object' || typeof o.xp !== 'number' || typeof o.days !== 'object') throw new Error('format');
      profile = Object.assign(newProfile(), o, { avatarUrl: profile.avatarUrl, name: o.name || profile.name });
      saveProfile(); updateProfileBtn(); renderProfile(); toast('Profil restauré');
      return;
    }
    const o = await XFER.unpack(t);
    if (!confirm('Remplacer les données de ce profil par celles du code (' + ((o.meta && o.meta.name) || 'sans nom') + ') ?')) return;
    PKEYS.forEach(function (k) { const key = k.slice(6); if (o.data[key] !== undefined) localStorage.setItem(nk(k), JSON.stringify(o.data[key])); });
    toast('Données restaurées');

    } catch (e) { if (e && e.name === 'AbortError') return; }
    const a = document.createElement('a');

  // ---- fabrication d'un cours à partir d'un article complet ----
  function parseSections(text) {
    const re = /^(={2,4})\s*(.+?)\s*\1\s*$/gm;
    const out = [];
    let last = 0, title = 'Introduction', level = 1, m;
    const push = function (t, lv, body) { body = body.trim(); if (body) out.push({ title: t, level: lv, text: body }); };
    while ((m = re.exec(text))) { push(title, level, text.slice(last, m.index)); title = m[2].trim(); level = m[1].length; last = re.lastIndex; }
    push(title, level, text.slice(last));
    return out;
  }
  function prepText(raw) {
    return cleanText(raw).split(/\n+/).map(function (p) { return p.trim(); }).filter(function (p) { return p.length > 40; }).join('\n\n');
  }
  function chunkText(text, max) {
    const units = [];
    text.split('\n\n').forEach(function (p) {
      if (p.length <= max) { units.push(p); return; }
      let buf = '';
      splitSentences(p).forEach(function (s) {
        if (buf && buf.length + 1 + s.length > max * 0.8) { units.push(buf); buf = s; } else buf = buf ? buf + ' ' + s : s;
      });
      if (buf) units.push(buf);
    });
    const chunks = [];
    let cur = '';
    units.forEach(function (u) {
      if (cur && cur.length + u.length + 2 > max && cur.length >= 600) { chunks.push(cur); cur = u; }
      else cur = cur ? cur + '\n\n' + u : u;
    });
    if (cur) { if (chunks.length && cur.length < 400) chunks[chunks.length - 1] += '\n\n' + cur; else chunks.push(cur); }
    return chunks;
  }
  function buildModules(text) {
    const mods = [];
    let cur = null, skipping = false, skipLevel = 9;
    parseSections(text).forEach(function (sec) {
      if (SKIP_SECTIONS.test(sec.title)) { skipping = true; skipLevel = sec.level; return; }
      if (skipping && sec.level > skipLevel) return;
      skipping = false;
      const body = prepText(sec.text);
      if (!body) return;
      const title = sec.level === 1 ? 'Introduction' : sec.title;
      if (sec.level <= 2 || !cur) { cur = { title: title, parts: [] }; mods.push(cur); }
      cur.parts.push({ title: title, text: body });
    });
    const out = [];
    mods.forEach(function (mod) {
      const parts = [];
      mod.parts.forEach(function (p) { if (p.text.length < 400 && parts.length) parts[parts.length - 1].text += '\n\n' + p.text; else parts.push({ title: p.title, text: p.text }); });
      const lessons = [];
      parts.forEach(function (p) {
        const ch = chunkText(p.text, 2000);
        ch.forEach(function (c, k) { lessons.push({ title: ch.length > 1 ? p.title + ' (' + (k + 1) + '/' + ch.length + ')' : p.title, text: c }); });
      });
      if (lessons.length) out.push({ title: mod.title, lessons: lessons });
    });
    const merged = [];
    out.forEach(function (m) {
      const len = m.lessons.reduce(function (a, l) { return a + l.text.length; }, 0);
      if (len < 600 && merged.length) m.lessons.forEach(function (l) { merged[merged.length - 1].lessons.push(l); });
      else merged.push(m);
    });
    let n = 0;
    const capped = [];
    merged.forEach(function (m) {
      if (n >= MAX_LESSONS) return;
      const ls = m.lessons.slice(0, MAX_LESSONS - n);
      n += ls.length;
      capped.push({ title: m.title, lessons: ls });
    });
    return capped;
  }

  function extractTerms(sentence) {
    const out = [];
    let m;
    TERM_RE.lastIndex = 0;
    while ((m = TERM_RE.exec(sentence))) {
      if (m.index === 0) continue;
      let t = m[0].trim();
      const words = t.split(/\s+/);
      if (STOP.has(words[0])) { words.shift(); t = words.join(' '); }
      if (!t || t.length < 4 || STOP.has(t)) continue;
      out.push(t);
    }
    return out;
  }
  function termStats(lessons) {
    const freq = {};
    lessons.forEach(function (l) {
      splitSentences(l.text.replace(/\n+/g, ' ')).forEach(function (s) { extractTerms(s).forEach(function (t) { freq[t] = (freq[t] || 0) + 1; }); });
    });
    return freq;
  }
  function wc(t) { return t.split(/\s+/).length; }
  function termDistractors(ans, sentence, freq) {
    const pool = Object.keys(freq).filter(function (t) {
      return t !== ans && ans.indexOf(t) < 0 && t.indexOf(ans) < 0 && sentence.indexOf(t) < 0 && Math.abs(wc(t) - wc(ans)) <= 1;
    }).sort(function (a, b) { return freq[b] - freq[a]; }).slice(0, 40);
    if (pool.length < 3) return null;
    return shuffle(pool).slice(0, 3);
  }
  function yearDistractors(y, allYears, sentence) {
    const set = new Set();
    const free = function (v) { return v > 0 && v <= 2100 && v !== y && sentence.indexOf(String(v)) < 0; };
    shuffle(allYears.filter(function (v) { return free(v) && Math.abs(v - y) <= 120; })).slice(0, 2).forEach(function (v) { set.add(v); });
    const offs = shuffle([-30, -20, -10, -5, -3, -2, -1, 1, 2, 3, 5, 10, 20, 30]);
    for (let i = 0; i < offs.length && set.size < 3; i++) { const v = y + offs[i]; if (free(v)) set.add(v); }
    return Array.from(set).slice(0, 3);
  }

  // jusqu'à 6 QCM par leçon (3 pour tester la leçon, les autres pour le QCM de chapitre et l'examen) + 1 question de rappel
  function makeCards(lesson, li, freq, allYears, cid, articleTitle) {
    const sents = shuffle(splitSentences(lesson.text.replace(/\s*\n+\s*/g, ' ')).filter(function (s) { return s.length >= 45 && s.length <= 240; }));
    const cards = [];
    const used = new Set();
    const t0 = todayKey();
    function add(c) { c.id = cid + ':' + li + ':' + cards.length; c.lesson = li; c.box = 0; c.due = t0; c.reps = 0; c.lapses = 0; c.on = false; cards.push(c); }
    function yearCard() {
      for (let i = 0; i < sents.length; i++) {
        const s = sents[i];
        if (used.has(s)) continue;
        const m = YEAR_RE.exec(s);
        if (!m) continue;
        const y = parseInt(m[2], 10);
        const ds = yearDistractors(y, allYears, s);
        if (ds.length < 3) continue;
        used.add(s);
        add({ type: 'mcq', q: s.replace(m[0], m[1] + '_____'), a: String(y), opts: shuffle([String(y)].concat(ds.map(String))), expl: s });
        return true;
      }
      return false;
    }
    function termCard() {
      for (let i = 0; i < sents.length; i++) {
        const s = sents[i];
        if (used.has(s)) continue;
        const ts = extractTerms(s).filter(function (t) { return (freq[t] || 0) >= 2 || t.length >= 7; });
        if (!ts.length) continue;
        ts.sort(function (a, b) { return (freq[b] || 0) - (freq[a] || 0); });
        const ans = ts[0];
        const ds = termDistractors(ans, s, freq);
        if (!ds) continue;
        used.add(s);
        add({ type: 'mcq', q: s.split(ans).join('_____'), a: ans, opts: shuffle([ans].concat(ds)), expl: s });
        return true;
      }
      return false;
    }
    yearCard(); termCard(); termCard(); yearCard(); termCard(); termCard();
    cards.forEach(function (c, i) { c.role = i < 3 ? 'lesson' : 'test'; });
    const first = splitSentences(lesson.text.replace(/\s*\n+\s*/g, ' ')).slice(0, 2).join(' ');
    const isIntro = lesson.title === 'Introduction';
    add({ type: 'recall', role: 'lesson', q: isIntro ? 'Que retiens-tu de : ' + articleTitle + ' ?' : 'Que retiens-tu de « ' + lesson.title.replace(/\s*\(\d+\/\d+\)$/, '') + ' » ?', a: first.length > 360 ? first.slice(0, 357).replace(/\s+\S*$/, '') + '…' : first });
    return cards;
  }

  // ajoute un article (chapitres + leçons + questions) à un cours ; renvoie le nombre de leçons ajoutées
  function addArticleToCourse(c, art) {
    const mods = buildModules(art.text);
    const added = [];
    mods.forEach(function (m) {
      const mi = c.modules.length;
      c.modules.push({ title: m.title === 'Introduction' && c.modules.length ? 'Introduction · ' + art.title : m.title, article: art.title });
      m.lessons.forEach(function (l) { c.lessons.push({ title: l.title === 'Introduction' ? 'Introduction' : l.title, text: l.text, mod: mi, done: false, score: null }); added.push(c.lessons.length - 1); });
    });
    if (added.length < 2) return 0;
    const sub = added.map(function (i) { return c.lessons[i]; });
    const freq = termStats(sub);
    const years = [];
    sub.forEach(function (l) { (l.text.match(/\b(1[0-9]{3}|20[0-2][0-9]|[3-9][0-9]{2})\b/g) || []).forEach(function (y) { years.push(parseInt(y, 10)); }); });
    added.forEach(function (i) { c.cards = c.cards.concat(makeCards(c.lessons[i], i, freq, years, c.id, art.title)); });
    return added.length;
  }
  function newCourse(art) {
    const c = { id: 'c' + Date.now().toString(36), src: art.src || 'Wikipédia', title: art.title, desc: art.desc || '', thumb: art.thumb || '', created: todayKey(), modules: [], lessons: [], cards: [], tests: {}, exam: null, diploma: '', completed: '', articles: [art.title] };
    ensureModel(c);
    if (!addArticleToCourse(c, art)) return null;
    return c;
  }

  // ---- réseau ----
  async function wikiSearch(q) {
    const url = WIKI + '?action=query&format=json&origin=*&formatversion=2&generator=search&gsrnamespace=0&gsrlimit=12&gsrsearch=' + encodeURIComponent(q) + '&prop=description|pageimages|info&piprop=thumbnail&pithumbsize=160';
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const pages = ((j.query && j.query.pages) || []).slice().sort(function (a, b) { return a.index - b.index; });
    return pages.filter(function (p) { return !/^(Liste|Catégorie|Wikipédia|Portail|Modèle|Aide|Projet)\b/i.test(p.title); })
      .map(function (p) { return { title: p.title, desc: p.description || '', thumb: p.thumbnail ? p.thumbnail.source : '', len: p.length || 0 }; });
  }
  function sizeLabel(len) { return len > 90000 ? 'Cours très complet' : len > 35000 ? 'Cours complet' : len > 12000 ? 'Cours moyen' : 'Cours court'; }
  async function fetchVikidiaArticle(title) {
    try {
      const url = 'https://fr.vikidia.org/w/api.php?action=query&format=json&origin=*&formatversion=2&redirects=1&titles=' + encodeURIComponent(title) + '&prop=extracts&explaintext=1&exsectionformat=wiki';
      const r = await fetch(url);

    study.courses.forEach(function (c) { c.cards.forEach(function (cd) { if (cd.on && cd.type === 'mcq' && cd.opts) sc.push({ c: c, cd: cd }); }); });
    shuffle(sc).sort(function (a, b) { return (a.cd.box || 0) - (b.cd.box || 0); });
    const fromCourse = function (x) { return { k: 'study', q: x.cd.q, a: x.cd.a, opts: shuffle(x.cd.opts.slice()), expl: x.cd.expl, cid: x.c.id, id: x.cd.id, src: x.c.title }; };
    sc.slice(0, 4).forEach(function (x) { out.push(fromCourse(x)); });
    const pool = shuffle(factsPool());
    const years = [];
    pool.forEach(function (f) { (f.e.match(/\b(1[0-9]{3}|20[0-2][0-9]|[3-9][0-9]{2})\b/g) || []).forEach(function (y) { years.push(parseInt(y, 10)); }); });
    const used = {};
    let nDates = 0;
    pool.forEach(function (f) { if (nDates >= 3 || out.length >= 10) return; const q = yearQuestion(f, years); if (q) { out.push(q); used[f.t] = 1; nDates++; } });
    if (pool.length >= 4) pool.forEach(function (f) { if (out.length >= 10 || used[f.t]) return; const q = whoQuestion(f, pool); if (q) { out.push(q); used[f.t] = 1; } });

    let nd = 0;

    if (pool.length >= 4) pool.forEach(function (f) { if (out.length >= n || used[f.t]) return; const q = whoQuestion(f, pool); if (q) { out.push(q); used[f.t] = 1; } });

  function lessonLandmarks(text) {
    const years = [];
    let m;
    YEAR_RE_G.lastIndex = 0;
    while ((m = YEAR_RE_G.exec(text))) { const y = parseInt(m[1], 10); if (years.indexOf(y) < 0) years.push(y); }
    years.sort(function (a, b) { return a - b; });
    const freq = {};
    splitSentences(text.replace(/\n+/g, ' ')).forEach(function (s) { extractTerms(s).forEach(function (t) { freq[t] = (freq[t] || 0) + 1; }); });
    const terms = Object.keys(freq).sort(function (a, b) { return freq[b] - freq[a] || b.length - a.length; }).slice(0, 6);
    return { years: years.slice(0, 6), terms: terms };
  }

    body.appendChild(nav);

  // ---- séances de questions ----
  function entries(cards, c) { return cards.map(function (cd) { return { c: c, card: cd, retried: false }; }); }
  function mkSess(mode, c, li, mi, cards) {
    return { mode: mode, cid: c ? c.id : null, li: li || 0, mi: mi || 0, queue: entries(cards, c), idx: 0, ok: 0, ko: 0, first: 0, firstOk: 0, picked: null, shown: false };
  }
  function startLessonTest(c, li) {
    const cards = c.cards.filter(function (x) { return x.lesson === li && x.role !== 'test'; });
    const mcq = shuffle(cards.filter(function (x) { return x.type === 'mcq'; }));
    const rec = cards.filter(function (x) { return x.type === 'recall'; });
    sv.sess = mkSess('lesson', c, li, c.lessons[li].mod, mcq.concat(rec));
    go('session');
  }
  function startModuleTest(c, mi) {
    const idxs = modLessons(c, mi);
    if (!idxs.every(function (i) { return c.lessons[i].done; })) { toast('Termine d\'abord les leçons du chapitre'); return; }
    let pool = shuffle(c.cards.filter(function (x) { return idxs.indexOf(x.lesson) >= 0 && x.type === 'mcq' && x.role === 'test'; }));
    if (pool.length < 6) pool = pool.concat(shuffle(c.cards.filter(function (x) { return idxs.indexOf(x.lesson) >= 0 && x.type === 'mcq' && x.role !== 'test'; })).slice(0, 6 - pool.length));
    pool = pool.slice(0, 10);
    if (pool.length < 3) { toast('Pas assez de questions pour ce chapitre'); return; }
    sv.sess = mkSess('test', c, 0, mi, pool);
    go('session');
  }
  function startExam(c) {
    if (c.lessons.some(function (l) { return !l.done; })) { toast('Termine d\'abord toutes les leçons'); return; }
    let pool = shuffle(c.cards.filter(function (x) { return x.type === 'mcq' && x.role === 'test'; }));
    if (pool.length < 10) pool = pool.concat(shuffle(c.cards.filter(function (x) { return x.type === 'mcq' && x.role !== 'test'; })).slice(0, 10 - pool.length));
    pool = pool.slice(0, 20);
    if (pool.length < 4) { toast('Pas assez de questions pour un examen'); return; }
    sv.sess = mkSess('exam', c, 0, 0, pool);
    go('session');
  }
  function startReview() {
    const items = shuffle(dueCards()).slice(0, 15);
    if (!items.length) { toast('Rien à réviser pour le moment'); return; }
    const S = mkSess('review', null, 0, 0, []);
    S.queue = items.map(function (x) { return { c: x.c, card: x.card, retried: false }; });
    sv.sess = S;
    go('session');
  }

  function gradeEntry(S, entry, q) {
    const cd = entry.card, t = todayKey();
    if (!entry.retried) { S.first++; if (q > 0) S.firstOk++; logStudy(q > 0); }
    if (q === 0) {
      cd.box = 0; cd.due = t; cd.lapses = (cd.lapses || 0) + 1; S.ko++;
      if (!entry.retried) S.queue.push({ c: entry.c, card: cd, retried: true });
    } else {
      cd.box = q === 2 ? Math.min(6, (cd.box || 0) + 1) : Math.max(1, cd.box || 0);
      cd.due = addDays(t, INTERVALS[cd.box]);
      S.ok++;
    }
    cd.reps = (cd.reps || 0) + 1;
    if (S.mode === 'test' || S.mode === 'exam') cd.on = true;
    saveStudy();
    studyCredit(2, 1);
  }

  function nextQuestion() { const S = sv.sess; S.idx++; S.picked = null; S.shown = false; renderStudy(); studyPanel.scrollTop = 0; }
  const MODE_LABEL = { lesson: 'Test de la leçon', test: 'QCM de chapitre', exam: 'Examen final', review: 'Révision' };

  function viewSession(body) {
    const S = sv.sess;
    if (!S) { go('home'); return; }
    if (S.idx >= S.queue.length) { finishSession(); return; }
    const entry = S.queue[S.idx];
    const cd = entry.card;
    body.appendChild(backBtn('Quitter', function () { if (S.idx === 0 || confirm('Quitter cette séance ? Tes réponses déjà données sont conservées.')) finishQuit(); }));
    body.appendChild(el('div', 'kick', MODE_LABEL[S.mode] + ' · ' + (S.idx + 1) + '/' + S.queue.length + (entry.retried ? ' · à retenter' : '')));
    body.appendChild(progressBar(Math.round(S.idx / S.queue.length * 100)));
    if (S.mode === 'review' && entry.c) body.appendChild(el('p', 'src', entry.c.title));

    if (cd.type === 'mcq') {
      body.appendChild(el('p', 'qtext', cd.q));
      const box = el('div', 'opts');
      cd.opts.forEach(function (o) {
        const b = el('button', 'opt', o); b.type = 'button';
        if (S.picked != null) { b.disabled = true; if (o === cd.a) b.classList.add('good'); else if (o === S.picked) b.classList.add('bad'); }
        b.addEventListener('click', function () { if (S.picked != null) return; S.picked = o; gradeEntry(S, entry, o === cd.a ? 2 : 0); renderStudy(); });
        box.appendChild(b);
      });
      body.appendChild(box);
      if (S.picked != null) {
        const ok = S.picked === cd.a;
        const fb = el('div', 'fb ' + (ok ? 'good' : 'bad'));
        fb.appendChild(el('b', null, ok ? '✅ Bien joué !' : '❌ La bonne réponse : ' + cd.a));
        fb.appendChild(el('p', null, cd.expl));
        body.appendChild(fb);
        body.appendChild(pbtn('Suivant', '', nextQuestion));
      }
    } else {
      body.appendChild(el('p', 'qtext', cd.q));
      body.appendChild(el('p', 'sub', 'Essaie de répondre dans ta tête, puis vérifie.'));
      if (!S.shown) body.appendChild(pbtn('Afficher la réponse', '', function () { S.shown = true; renderStudy(); }));
      else {
        const fb = el('div', 'fb'); fb.appendChild(el('b', null, 'Réponse')); fb.appendChild(el('p', null, cd.a));
        body.appendChild(fb);
        body.appendChild(el('p', 'sub', 'Comment c\'était ?'));
        const r = el('div', 'prow');
        const grade = function (q) { gradeEntry(S, entry, q); nextQuestion(); };
        r.appendChild(pbtn('Je ne savais pas', 'danger', function () { grade(0); }));
        r.appendChild(pbtn('Difficile', 'ghost', function () { grade(1); }));
        r.appendChild(pbtn('Facile', '', function () { grade(2); }));
        body.appendChild(r);
      }
    }
  }

  function finishQuit() {
    const S = sv.sess;
    sv.sess = null;
    if (S && S.mode === 'lesson') go('lesson', { cid: S.cid, li: S.li });
    else if (S && (S.mode === 'test' || S.mode === 'exam')) go('course', { cid: S.cid });
    else go('home');
  }

  function finishSession() {
    const S = sv.sess;
    const pct = S.first ? Math.round(S.firstOk / S.first * 100) : 0;
    const sum = { mode: S.mode, pct: pct, first: S.first, firstOk: S.firstOk, cid: S.cid, li: S.li, mi: S.mi, news: [] };
    const c = S.cid ? study.courses.find(function (x) { return x.id === S.cid; }) : null;
    if (c && S.mode === 'lesson') {
      c.cards.forEach(function (cd) { if (cd.lesson === S.li && cd.role !== 'test') cd.on = true; });
      const l = c.lessons[S.li];
      l.score = Math.max(l.score || 0, pct);
      if (!l.done) {
        l.done = true;
        profile.lessons = (profile.lessons || 0) + 1;
        weekBump('lessons');
        studyCredit(25, 0);
        sum.news.push('📖 Leçon terminée ! +' + gain(25) + ' points');
        if (c.lessons.every(function (x) { return x.done; }) && !c.completed) {
          c.completed = todayKey();
          profile.courses = (profile.courses || 0) + 1;
          awardTier(c, 'bronze', null);
          sum.courseDone = true;
          studyCredit(150, 0);
          sum.news.push('🥉 Cours terminé ! Le badge « ' + c.title + ' » est ajouté à ta collection.');
        }
      }
    } else if (c && S.mode === 'test') {
      const prev = c.tests[S.mi];
      c.tests[S.mi] = Math.max(prev || 0, pct);
      if (pct >= PASS_TEST && (prev == null || prev < PASS_TEST)) { studyCredit(40, 0); sum.news.push('✅ Chapitre validé ! +' + gain(40) + ' points'); }
    } else if (c && S.mode === 'exam') {
      c.exam = Math.max(c.exam || 0, pct);
      if (pct >= PASS_EXAM && !c.diploma) {
        c.diploma = todayKey();
        profile.diplomas = (profile.diplomas || 0) + 1;
        awardTier(c, 'or', c.exam);
        studyCredit(120, 0);
        sum.news.push('🏅 Examen réussi ! Ton badge passe en or.');
      }
    }
    if (c) { syncBadge(c); if (checkMastery(c)) sum.news.push('💎 Maîtrise atteinte ! Ton badge passe en diamant.'); }
    if (S.mode === 'review') {
      const seen = {};
      S.queue.forEach(function (e) { if (e.c && !seen[e.c.id]) { seen[e.c.id] = 1; if (checkMastery(e.c)) sum.news.push('💎 Maîtrise atteinte pour « ' + e.c.title + ' » !'); } });
    }
    saveStudy();
    sv.sess = null;
    go('summary', { sum: sum });
  }

  function viewSummary(body) {
    const sum = sv.sum;
    if (!sum) { go('home'); return; }
    const need = sum.mode === 'exam' ? PASS_EXAM : sum.mode === 'test' ? PASS_TEST : 0;
    const box = el('div', 'pcard');
    box.appendChild(el('h3', null, need && sum.pct < need ? '💪 Pas encore, mais tu y es presque' : sum.pct >= 80 ? '🌟 Excellent !' : '👍 Bien joué'));
    box.appendChild(el('div', 'bignum', sum.pct + ' %'));
    box.appendChild(el('p', 'sub', sum.firstOk + ' bonne' + (sum.firstOk > 1 ? 's' : '') + ' réponse' + (sum.firstOk > 1 ? 's' : '') + ' du premier coup sur ' + sum.first + '. Les questions ratées reviendront dans tes révisions.' + (need ? ' Il faut ' + need + ' % pour réussir.' : '')));
    sum.news.forEach(function (n) { box.appendChild(el('p', 'sub', n)); });
    body.appendChild(box);
    const r = el('div', 'prow');
    const c = sum.cid ? study.courses.find(function (x) { return x.id === sum.cid; }) : null;
    if (sum.mode === 'lesson' && c) {
      const nxt = c.lessons.findIndex(function (l) { return !l.done; });
      const m = c.lessons[sum.li].mod;
      if (modDone(c, m) && c.tests[m] == null) r.appendChild(pbtn('QCM du chapitre', '', function () { startModuleTest(c, m); }));
      if (nxt >= 0) r.appendChild(pbtn('Leçon suivante', c.tests[m] == null && modDone(c, m) ? 'ghost' : '', function () { go('lesson', { cid: sum.cid, li: nxt }); }));
      else if (!c.diploma) r.appendChild(pbtn('Passer l\'examen final', '', function () { startExam(c); }));
      r.appendChild(pbtn('Retour au cours', 'ghost', function () { go('course', { cid: sum.cid }); }));
    } else if (c) {
      if (sum.mode === 'exam' && c.diploma) r.appendChild(pbtn('🎓 Certificat à partager', '', function () { shareCertificate(c); }));
      if (sum.mode === 'exam' && sum.pct < PASS_EXAM) r.appendChild(pbtn('Réessayer', '', function () { startExam(c); }));
      if (sum.mode === 'test' && sum.pct < PASS_TEST) r.appendChild(pbtn('Réessayer', '', function () { startModuleTest(c, sum.mi); }));
      r.appendChild(pbtn('Retour au cours', 'ghost', function () { go('course', { cid: sum.cid }); }));
    } else {
      if (dueCards().length) r.appendChild(pbtn('Continuer (' + dueCards().length + ')', '', startReview));
      r.appendChild(pbtn('Terminer', 'ghost', function () { go('home'); }));
    }
    body.appendChild(r);
    if (sum.courseDone && c) body.appendChild(suggestCard(c));
  }
